[project]
name = "afar"
version = "0.0.1"
description = "afar — a continuously-running band of AI agents. The installation kernel."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = ["ensemble"]

[project.optional-dependencies]
dev = ["pytest>=8"]
listen = ["torch", "transformers", "librosa", "soundfile", "nnAudio"]
publish = ["psycopg[binary]>=3.1"]

[tool.uv.sources]
ensemble = { path = "../../moldzine/ensemble", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["afar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
